<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Send to Expense Inbox — DAC's Admin</title>
<link rel="manifest" href="manifest-admin.json">
<meta name="theme-color" content="#0f6342">
<link rel="icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'IBM Plex Sans', sans-serif; -webkit-font-smoothing: antialiased; background: #eceae4; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 12px; }
  a { color: #157a52; text-decoration: none; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #d5d4ce; border-radius: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }

  .sc-frame { display: flex; flex-direction: column; width: 412px; max-width: 100%; height: 812px; max-height: calc(100dvh - 24px); background: #fff; border: 1px solid #e6e5e0; border-radius: 30px; overflow: hidden; box-shadow: 0 20px 56px rgba(20,40,30,.12); }
  .sc-brand { display: flex; align-items: center; gap: 8px; padding: 22px 28px 0; }
  .sc-brand-dot { width: 9px; height: 9px; border-radius: 50%; background: #157a52; }
  .sc-brand-label { font: 600 12px 'IBM Plex Sans'; letter-spacing: .4px; color: #77857d; }

  .sc-progress { padding: 18px 28px 0; }
  .sc-dots { display: flex; align-items: center; gap: 6px; }
  .sc-dot { height: 6px; border-radius: 99px; flex: 1; background: #e2e4df; transition: all .3s; }
  .sc-dot.done, .sc-dot.current { background: #157a52; }
  .sc-dot.current { flex: 2.4; }
  .sc-stepnum { font: 600 11px 'IBM Plex Sans'; letter-spacing: .6px; color: #9aa39c; text-transform: uppercase; margin-top: 11px; }

  .sc-body { flex: 1; overflow-y: auto; padding: 22px 28px 10px; }
  .sc-h1 { font: 700 27px 'IBM Plex Sans'; color: #16211c; letter-spacing: -.4px; line-height: 1.18; margin: 0 0 8px; }
  .sc-sub { font: 400 14.5px 'IBM Plex Sans'; color: #77857d; line-height: 1.5; margin: 0 0 24px; }

  .sc-upload { width: 100%; padding: 36px 20px; border: 2px dashed #bfc4bd; border-radius: 20px; background: #faf9f6; color: #5d6b63; font: 700 15px 'IBM Plex Sans'; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 9px; }
  .sc-upload-plus { width: 54px; height: 54px; border-radius: 50%; background: #eaf3ee; color: #157a52; font-size: 29px; display: flex; align-items: center; justify-content: center; }
  .sc-thumbs { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  .sc-thumb { position: relative; width: 108px; height: 108px; border-radius: 16px; overflow: hidden; border: 1px solid #e6e5e0; background: #f3f2ef; display: flex; align-items: center; justify-content: center; }
  .sc-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .sc-thumb-pdf { font: 600 10px 'IBM Plex Sans'; color: #9aa39c; letter-spacing: .4px; text-align: center; padding: 6px; word-break: break-all; }
  .sc-thumb-rm { position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; border: none; border-radius: 50%; background: rgba(20,30,25,.6); color: #fff; font-size: 14px; line-height: 1; cursor: pointer; }
  .sc-err { background: #fbeeec; border: 1px solid #f2d3cd; color: #a1443a; font: 500 13px 'IBM Plex Sans'; padding: 11px 14px; border-radius: 11px; margin-top: 12px; }

  .sc-options { display: flex; flex-direction: column; gap: 12px; }
  .sc-opt { display: flex; align-items: center; justify-content: space-between; gap: 14px; width: 100%; text-align: left; padding: 20px 18px; border-radius: 18px; cursor: pointer; border: 2px solid #e6e5e0; background: #fff; font-family: 'IBM Plex Sans'; }
  .sc-opt.on { border-color: #157a52; background: #eaf3ee; box-shadow: 0 6px 18px rgba(21,122,82,.14); }
  .sc-opt-label { font: 700 16px 'IBM Plex Sans'; color: #16211c; }
  .sc-opt-sub { font: 400 13px 'IBM Plex Sans'; color: #8a938c; margin-top: 3px; }
  .sc-radio { flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #fff; border: 2px solid #d7d6d0; }
  .sc-opt.on .sc-radio { background: #157a52; border-color: #157a52; }
  .sc-radio span { color: #fff; font-size: 13px; font-weight: 700; }

  .sc-text { width: 100%; padding: 17px 18px; border: 2px solid #d9d8d2; border-radius: 16px; font: 400 16px 'IBM Plex Sans'; color: #16211c; outline: none; }
  .sc-text:focus { border-color: #157a52; }
  textarea.sc-text { resize: none; line-height: 1.5; }
  .sc-chips { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 16px; }
  .sc-chip { padding: 10px 16px; border-radius: 999px; cursor: pointer; font: 600 13px 'IBM Plex Sans'; border: 1.5px solid #d9d8d2; background: #fff; color: #5d6b63; }
  .sc-chip.on { border-color: #157a52; background: #157a52; color: #fff; }

  .sc-review { display: flex; flex-direction: column; gap: 2px; }
  .sc-rrow { display: flex; justify-content: space-between; gap: 16px; padding: 15px 0; border-bottom: 1px solid #f0efea; }
  .sc-rlabel { font: 500 12px 'IBM Plex Sans'; color: #9aa39c; text-transform: uppercase; letter-spacing: .5px; flex-shrink: 0; }
  .sc-rvalue { font: 600 15px 'IBM Plex Sans'; color: #16211c; text-align: right; word-break: break-word; }
  .sc-send { width: 100%; margin-top: 22px; padding: 18px; border: none; border-radius: 16px; background: #157a52; color: #fff; font: 700 16px 'IBM Plex Sans'; cursor: pointer; }
  .sc-send:disabled { opacity: .6; cursor: default; }

  .sc-footer { display: flex; gap: 12px; padding: 14px 28px 26px; border-top: 1px solid #f0efea; }
  .sc-back { flex: 0 0 auto; padding: 16px 24px; border: 2px solid #e0dfd9; border-radius: 16px; background: #fff; color: #3a453f; font: 700 15px 'IBM Plex Sans'; cursor: pointer; }
  .sc-next { flex: 1; padding: 16px; border: none; border-radius: 16px; background: #157a52; color: #fff; font: 700 16px 'IBM Plex Sans'; cursor: pointer; }

  .sc-center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px; }
  .sc-done-badge { width: 88px; height: 88px; border-radius: 50%; background: #eaf3ee; display: flex; align-items: center; justify-content: center; font-size: 42px; color: #157a52; }
  .sc-done-h2 { font: 700 24px 'IBM Plex Sans'; color: #16211c; margin: 22px 0 0; }
  .sc-done-p { font: 400 14.5px 'IBM Plex Sans'; color: #77857d; line-height: 1.5; margin: 8px 0 0; max-width: 270px; }
  .sc-done-actions { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 260px; margin-top: 30px; }
  .sc-done-primary { padding: 16px; border: none; border-radius: 15px; background: #157a52; color: #fff; font: 700 15px 'IBM Plex Sans'; cursor: pointer; }
  .sc-done-secondary { padding: 16px; border: 2px solid #157a52; border-radius: 15px; background: #fff; color: #157a52; font: 700 15px 'IBM Plex Sans'; text-align: center; }
  .sc-diag { margin-top: 12px; padding: 11px 14px; border-radius: 11px; font: 500 13px 'IBM Plex Sans'; line-height: 1.45; }
  .sc-diag.bad { background: #fbeeec; border: 1px solid #f2d3cd; color: #a1443a; }
  .sc-diag.ok  { background: #eaf3ee; border: 1px solid #cfe5d8; color: #27614a; }
  .sc-diag-btn { margin-left: 4px; padding: 5px 12px; border: none; border-radius: 8px; background: #a1443a; color: #fff; font: 700 12px 'IBM Plex Sans'; cursor: pointer; }
  .sc-diag-pick { display: block; width: 100%; margin-top: 12px; padding: 14px; border: none; border-radius: 12px; background: #157a52; color: #fff; font: 700 15px 'IBM Plex Sans'; cursor: pointer; }
  .sc-diag-more { margin-top: 8px; }
  .sc-diag-link { border: none; background: none; padding: 0; color: #8a938c; font: 600 12px 'IBM Plex Sans'; text-decoration: underline; cursor: pointer; }
  .sc-diag-raw { margin-top: 8px; padding: 10px; border-radius: 10px; background: #f3f2ef; color: #5d6b63; font: 400 11px/1.45 ui-monospace, monospace; white-space: pre-wrap; word-break: break-word; max-height: 240px; overflow: auto; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="sc-frame">
  <div class="sc-brand">
    <div class="sc-brand-dot"></div>
    <div class="sc-brand-label">Expense Inbox</div>
  </div>

  <!-- Login gate -->
  <div class="sc-center hidden" id="scGate">
    <div style="font-size:42px;">🔒</div>
    <h2 class="sc-done-h2">Log in first</h2>
    <p class="sc-done-p">Open the Admin app and log in, then share the receipt again. Your shared image is kept and will still be here.</p>
    <div class="sc-done-actions">
      <a class="sc-done-secondary" href="admin.html">Open Admin</a>
    </div>
  </div>

  <!-- Wizard -->
  <div id="scWizard" class="hidden" style="display:flex;flex-direction:column;flex:1;min-height:0;">
    <div class="sc-progress">
      <div class="sc-dots" id="scDots"></div>
      <div class="sc-stepnum" id="scStepNum"></div>
    </div>
    <div class="sc-body" id="scBody"></div>
    <div class="sc-footer hidden" id="scFooter">
      <button type="button" class="sc-back hidden" id="scBack" onclick="scBack()">Back</button>
      <button type="button" class="sc-next hidden" id="scNext" onclick="scNext()">Continue</button>
    </div>
  </div>

  <!-- Done -->
  <div class="sc-center hidden" id="scDone">
    <div class="sc-done-badge">✓</div>
    <h2 class="sc-done-h2" id="scDoneTitle">All sent!</h2>
    <p class="sc-done-p">Staff will encode the details from your receipt. Nothing else for you to do.</p>
    <div class="sc-done-actions">
      <button type="button" class="sc-done-primary" onclick="scResetAll()">Send another</button>
      <a class="sc-done-secondary" href="admin.html">Open Admin</a>
    </div>
  </div>
</div>

<input type="file" id="scFile" accept="image/*,application/pdf" multiple class="hidden">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script>
'use strict';

// Keep the SW registered so the share-sheet POST is always intercepted.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/service-worker.js', { scope: '/' }).catch(() => {});
  });
}

const SHARE_CACHE = 'dacs-share-intake';
const SHARE_META  = '/shared-meta';

// What actually happened on the way in, so the photo step can say WHY it is
// empty. Without this the three failure modes — the service worker never ran,
// the share carried no file, the file was rejected here — all render as the
// same blank picker, which is what made this impossible to diagnose on a phone.
let scIntake = { fromShare: false, swRan: false, param: null, cached: 0, meta: null, rejected: [], swActive: null, error: '' };
try {
  const q = new URLSearchParams(location.search);
  scIntake.fromShare = q.has('shared');
  scIntake.swRan     = q.get('sw') === '1';
  scIntake.param     = q.has('shared') ? Number(q.get('shared')) : null;
} catch (_) {}

// ── Wizard copy + choice data (from the approved design) ──
const SYSTEMS = [
  { v: 'pc', l: 'Project Control',    s: 'DAC-managed site projects' },
  { v: 'pm', l: 'Project Management', s: 'Client-managed builds' },
];
const TYPES = {
  pc: [ { v: 'materials', l: 'Materials', s: 'Cement, rebar, hardware' },
        { v: 'labor',     l: 'Labor',     s: 'Worker wages' },
        { v: 'overhead',  l: 'Overhead',  s: 'Fuel, permits, misc.' } ],
  pm: [ { v: 'labor',     l: 'Labor',     s: 'Worker wages' },
        { v: 'materials', l: 'Materials', s: 'Supplies bought' },
        { v: 'both',      l: 'Out Source',s: 'Subcontracted work' },
        { v: 'overhead',  l: 'Overhead',  s: 'Rent, utilities, fuel, permits' } ],
};
const HEAD = {
  photo:    { h: 'Add the receipt photo',      s: 'Take a photo or upload the receipt. You can add more than one.' },
  system:   { h: 'Which system is this for?',  s: 'Not sure? Most site receipts are Project Control.' },
  project:  { h: 'Which project?',             s: 'Pick the project this expense belongs to.' },
  type:     { h: 'What kind of expense?',      s: 'Choose the closest match — staff can fix it later.' },
  category: { h: 'Which job is this for?',      s: 'Tap the job from the project’s labor contracts, or type your own.' },
  labor:    { h: 'Whose labor is this?',       s: 'Type the worker or laborer’s name.' },
  note:     { h: 'Anything staff should know?',s: 'Optional — supplier name, what it’s for, etc.' },
  review:   { h: 'Quick check before sending', s: 'Make sure this looks right, then send.' },
};
const DEFAULT_CATS = ['Cement', 'Rebar', 'Electrical', 'Plumbing', 'Paint', 'Hardware'];

// ── State ──
let S = scFresh();
let scFolders = [], scPmProjects = [], scRoles = [];

function scFresh() {
  return { step: 'photo', sys: 'pc', type: 'materials', project: '', cat: '', labor: '', note: '', photos: [], err: '' };
}
function scSteps() {
  const s = ['photo', 'system', 'project', 'type'];
  if (S.type === 'materials') s.push('category');
  else if (S.type === 'labor') s.push('labor');
  s.push('note', 'review');
  return s;
}
function $(id) { return document.getElementById(id); }
function scEsc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ── Shared-file intake (from the service worker's cache) ──
async function scLoadSharedFiles() {
  if (!('caches' in window)) { scIntake.error = 'This browser has no Cache storage, so shared files cannot be picked up.'; return; }
  try {
    const cache = await caches.open(SHARE_CACHE);

    // The service worker's breadcrumb: how many files it saw, what it kept, and
    // the error it hit (if any) on the way to the cache.
    try {
      const m = await cache.match(SHARE_META);
      if (m) scIntake.meta = await m.json();
    } catch (_) {}

    for (let i = 0; i < 20; i++) {
      const res = await cache.match('/shared-file-' + i);
      if (!res) break;
      scIntake.cached++;
      const blob = await res.blob();
      let name = 'shared-' + i;
      try { name = decodeURIComponent(res.headers.get('X-File-Name') || name); } catch (_) {}
      // Was: the reason a shared file got dropped was written to S.err and then
      // overwritten by the next file. Keep one line per rejected file instead.
      const bad = scPushFile(new File([blob], name, { type: blob.type }));
      if (bad) scIntake.rejected.push(name + ' — ' + bad);
    }
  } catch (e) {
    scIntake.error = 'Could not read the shared file: ' + ((e && (e.message || e.name)) || e);
  }
}

// Is a service worker actually in charge of this origin? If not, the share-sheet
// POST goes straight to Vercel, which answers 405 — the share can never work.
async function scCheckServiceWorker() {
  if (!('serviceWorker' in navigator)) { scIntake.swActive = false; return; }
  try {
    const reg = await navigator.serviceWorker.getRegistration('/');
    scIntake.swActive = !!(reg && reg.active);
  } catch (_) { scIntake.swActive = false; }
}
window.scFixServiceWorker = async function () {
  try {
    await navigator.serviceWorker.register('/service-worker.js', { scope: '/' });
    await navigator.serviceWorker.ready;
    await scCheckServiceWorker();
  } catch (e) { scIntake.error = 'Service worker install failed: ' + ((e && (e.message || e.name)) || e); }
  scRender();
};
async function scClearSharedCache() {
  try {
    const cache = await caches.open(SHARE_CACHE);
    for (const req of await cache.keys()) await cache.delete(req);
  } catch (_) {}
}

// Whitelist: real raster images + PDF only. `accept="image/*"` on the input is
// a UI hint the OS share sheet ignores, so validate here too. SVG is refused on
// purpose — an image/svg+xml "receipt" can carry <script> that would run when
// the receipt is later opened in a tab.
const SC_MAX_BYTES = 25 * 1024 * 1024;                 // 25 MB per file
const SC_ALLOWED_EXT = /\.(jpe?g|png|webp|heic|heif|pdf)$/i;
function scRejectReason(file) {
  const type = (file.type || '').toLowerCase();
  const name = file.name || '';
  if (/\.svg$/i.test(name) || type === 'image/svg+xml')
    return 'SVG files aren’t allowed — please share a photo (JPG/PNG) or a PDF.';
  const isImage = type.startsWith('image/');           // any raster image type
  const isPdf   = type === 'application/pdf';
  const extOk   = SC_ALLOWED_EXT.test(name);           // fallback when a shared file has no/blank type
  if (!isImage && !isPdf && !extOk)
    return 'That file type isn’t supported — please add a photo or a PDF.';
  if (file.size > SC_MAX_BYTES)
    return 'That file is too large (max 25 MB). Please add a smaller photo or PDF.';
  return null;
}

// Returns the rejection reason, or null when the file was accepted.
function scPushFile(file) {
  const bad = scRejectReason(file);
  if (bad) { S.err = bad; return bad; }
  const isImg = (file.type || '').startsWith('image/');
  S.photos.push({ file, previewUrl: isImg ? URL.createObjectURL(file) : null });
  S.err = '';
  return null;
}
window.scRemovePhoto = function (i) {
  const p = S.photos.splice(i, 1)[0];
  if (p && p.previewUrl) URL.revokeObjectURL(p.previewUrl);
  scRender();
};

$('scFile').addEventListener('change', (e) => {
  for (const f of e.target.files) scPushFile(f);
  e.target.value = '';
  scRender();
});

// ── Data loads ──
async function scLoadPickers() {
  try {
    const [fSnap, pSnap] = await Promise.all([
      db.collection('folders').orderBy('name').get(),
      db.collection('constructionProjects').orderBy('clientName').get(),
    ]);
    scFolders    = fSnap.docs.map((d) => ({ id: d.id, ...d.data() }));
    scPmProjects = pSnap.docs.map((d) => ({ id: d.id, ...d.data() }));
    if (S.step === 'project' || S.step === 'category') scRender();
  } catch (e) {
    S.err = 'Could not load projects: ' + (e.message || e);
    scRender();
  }
}
function scProjectOptions() {
  if (S.sys === 'pc') {
    return scFolders.map((f) => ({ v: f.id, l: f.name || 'Unnamed', s: f.parentFolderId ? 'Additional Works' : '' }));
  }
  // One client can run several projects with the same name — show the address and
  // start date so they are tellable apart, and fall back to a short id if even those
  // match. An unidentifiable pick files the expense against the wrong project.
  const opts = scPmProjects.map((p) => ({
    v: p.id,
    l: (p.clientName ? p.clientName + ' — ' : '') + (p.projectName || 'Unnamed'),
    s: [p.address, scStartedLabel(p.startDate)].filter(Boolean).join(' · '),
  }));
  const seen = {};
  opts.forEach((o) => { seen[o.l + '|' + o.s] = (seen[o.l + '|' + o.s] || 0) + 1; });
  return opts.map((o) => (seen[o.l + '|' + o.s] > 1
    ? { ...o, s: (o.s ? o.s + ' · ' : '') + 'ID ' + String(o.v).slice(0, 8) }
    : o));
}
function scStartedLabel(d) {
  if (!d) return '';
  const t = new Date(String(d).slice(0, 10) + 'T00:00:00');
  return isNaN(t) ? '' : 'Started ' + t.toLocaleDateString('en-PH', { month: 'short', year: 'numeric' });
}
// Suggestions are the chosen project's labor-contract ROLES ("the job, e.g. Tiling
// & masonry") — the same thing the Expenses screen now tags a material with, so a
// receipt captured here lands on a category staff can actually pick when encoding.
// The two systems keep their contracts in different places:
//   pc → top-level laborContracts, filtered by folderId
//   pm → constructionProjects/{id}/laborContracts (pm_labor_contracts)
// Best-effort: any failure just falls back to DEFAULT_CATS rather than blocking.
async function scLoadRoles() {
  scRoles = [];
  if (!S.project) return;
  try {
    const snap = S.sys === 'pc'
      ? await db.collection('laborContracts').where('folderId', '==', S.project).get()
      : await db.collection('constructionProjects').doc(S.project).collection('laborContracts').get();
    const set = new Set();
    snap.docs.forEach((d) => {
      const s = ((d.data() || {}).scope || '').trim();
      if (s) set.add(s);
    });
    scRoles = Array.from(set).sort((a, b) => a.localeCompare(b));
  } catch (e) {
    scRoles = [];   // leave the defaults in place
  }
  if (S.step === 'category') scRender();
}
function scCats() { return scRoles.length ? scRoles : DEFAULT_CATS; }

// ── Navigation ──
window.scChoose = function (stepKey, val) {
  if (stepKey === 'system') { S.sys = val; S.type = TYPES[val][0].v; S.project = ''; scRoles = []; }
  else if (stepKey === 'project') { S.project = val; scLoadRoles(); }   // async, fills in before/at the category step
  else if (stepKey === 'type') S.type = val;
  S.err = '';
  const steps = scSteps();
  const i = steps.indexOf(stepKey);
  if (i > -1 && i < steps.length - 1) S.step = steps[i + 1];
  scRender();
};
window.scNext = function () {
  const steps = scSteps();
  const i = steps.indexOf(S.step);
  if (S.step === 'photo' && S.photos.length === 0) { S.err = 'Please add at least one photo or PDF first.'; scRender(); return; }
  S.err = '';
  if (i < steps.length - 1) S.step = steps[i + 1];
  scRender();
};
window.scBack = function () {
  const steps = scSteps();
  const i = steps.indexOf(S.step);
  if (i > 0) S.step = steps[i - 1];
  S.err = '';
  scRender();
};
window.scSetField = function (f, val) { S[f] = val; };
window.scPickCat = function (c) { S.cat = c; scRender(); };
window.scResetAll = function () {
  S.photos.forEach((p) => { if (p.previewUrl) URL.revokeObjectURL(p.previewUrl); });
  S = scFresh();
  $('scDone').classList.add('hidden');
  $('scWizard').classList.remove('hidden');
  scRender();
};

// ── Send (upload each file + one inbox row per file) ──
window.scSend = async function () {
  const btn = $('scSendBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Sending…'; }
  try {
    const email = (auth.currentUser && auth.currentUser.email) || '';
    for (let i = 0; i < S.photos.length; i++) {
      const file = S.photos[i].file;
      const safe = (file.name || 'receipt').replace(/[^a-zA-Z0-9._-]/g, '_');
      const ref  = storage.ref('expenseInbox/' + Date.now() + '_' + i + '_' + safe);
      await ref.put(file);
      const url = await ref.getDownloadURL();
      const row = {
        system:    S.sys,
        imageUrl:  url,
        imageName: file.name || safe,
        entryType: S.type,
        category:  S.type === 'materials' ? (S.cat.trim() || null) : null,
        laborName: S.type === 'labor' ? (S.labor.trim() || null) : null,
        note:      S.note.trim() || null,
        status:    'pending',
        createdBy: email,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      };
      if (S.sys === 'pc') row.folderId = S.project; else row.pmProjectId = S.project;
      await db.collection('expenseInbox').add(row);
    }
    await scClearSharedCache();
    $('scDoneTitle').textContent = S.photos.length > 1 ? 'All ' + S.photos.length + ' sent!' : 'All sent!';
    $('scWizard').classList.add('hidden');
    $('scDone').classList.remove('hidden');
  } catch (e) {
    S.err = 'Save failed: ' + (e.message || e);
    if (btn) { btn.disabled = false; btn.textContent = 'Send to Inbox'; }
    scRender();
  }
};

// ── Intake diagnostics (photo step only) ──
// Plain-language first line, raw breadcrumb behind a toggle so a screenshot is
// enough to tell which boundary broke.
window.scToggleDiag = function () {
  const el = $('scDiagRaw');
  if (el) el.classList.toggle('hidden');
};
function scDiagHtml() {
  const m = scIntake.meta;
  const bits = [];

  if (scIntake.swActive === false) {
    bits.push({ tone: 'bad', msg: 'This device has no active service worker, so sharing a photo into this app cannot work — the share is rejected before the page loads. Tap Fix, then share the receipt again.', fix: true });
  }
  if (scIntake.error) bits.push({ tone: 'bad', msg: scIntake.error });
  scIntake.rejected.forEach((r) => bits.push({ tone: 'bad', msg: 'Shared file skipped: ' + r }));

  if (scIntake.fromShare && S.photos.length === 0 && !scIntake.rejected.length) {
    const nEntries = (m && Array.isArray(m.entries)) ? m.entries.length : -1;
    if (m && m.error) {
      bits.push({ tone: 'bad', msg: 'The share was received but could not be read (' + m.stage + '): ' + m.error });
    } else if (!scIntake.swRan) {
      bits.push({ tone: 'bad', msg: 'The share did not pass through the service worker, so no photo was handed over. Tap Fix, then share again.', fix: true });
    } else if (m && nEntries === 0) {
      // Chrome opened the app but attached nothing: an empty body, or a body
      // that is only the multipart closing boundary. Same cause, same remedy.
      bits.push({ tone: 'bad', pick: true, msg: 'Android opened the app but did not hand over the photo — this happens on some phones and is outside the app. Tap below and pick the same photo; everything else works normally.' });
    } else if (m && m.kept === 0 && nEntries > 0) {
      const fileEntries = m.entries.filter((e) => e.kind === 'file');
      bits.push({ tone: 'bad', msg: fileEntries.length
        ? 'The shared file arrived empty (0 bytes). Try sharing it from the Gallery or Photos app instead.'
        : 'The app that shared this sent no picture — only ' + (m.text || m.linkUrl ? 'text or a link' : 'empty fields') + '. Open the photo itself and share that, or add it below.' });
    } else {
      bits.push({ tone: 'bad', msg: 'The share arrived but no photo came with it. Add it below instead.' });
    }
  }

  if (!bits.length && scIntake.fromShare && S.photos.length) {
    bits.push({ tone: 'ok', msg: 'Received ' + S.photos.length + ' file' + (S.photos.length === 1 ? '' : 's') + ' from the share sheet.'
      + (m && m.source === 'fallback' ? ' (The sharing app used a different field name than expected — picked it up anyway.)' : '') });
  }

  if (!bits.length) return '';

  const raw = {
    url: location.search, swActive: scIntake.swActive, swRan: scIntake.swRan,
    sharedParam: scIntake.param, cacheEntries: scIntake.cached,
    loaded: S.photos.length, rejected: scIntake.rejected, meta: m,
  };
  return bits.map((b) =>
    '<div class="sc-diag ' + b.tone + '">' + scEsc(b.msg)
    + (b.fix ? ' <button type="button" class="sc-diag-btn" onclick="scFixServiceWorker()">Fix</button>' : '')
    + (b.pick ? '<button type="button" class="sc-diag-pick" onclick="document.getElementById(\'scFile\').click()">Pick the photo</button>' : '')
    + '</div>').join('')
    + '<div class="sc-diag-more"><button type="button" class="sc-diag-link" onclick="scToggleDiag()">Show details</button>'
    + '<pre class="sc-diag-raw hidden" id="scDiagRaw">' + scEsc(JSON.stringify(raw, null, 1)) + '</pre></div>';
}

// ── Render ──
function scRender() {
  const steps = scSteps();
  const idx = steps.indexOf(S.step);
  const head = HEAD[S.step] || { h: '', s: '' };

  $('scDots').innerHTML = steps.map((k, i) =>
    '<div class="sc-dot' + (i < idx ? ' done' : i === idx ? ' current' : '') + '"></div>').join('');
  $('scStepNum').textContent = 'Step ' + (idx + 1) + ' of ' + steps.length;

  let html = '<h1 class="sc-h1">' + scEsc(head.h) + '</h1><p class="sc-sub">' + scEsc(head.s) + '</p>';

  if (S.step === 'photo') {
    html += '<button type="button" class="sc-upload" onclick="document.getElementById(\'scFile\').click()">'
      + '<span class="sc-upload-plus">＋</span>Take or upload a photo</button>';
    if (S.photos.length) {
      html += '<div class="sc-thumbs">' + S.photos.map((p, i) =>
        '<div class="sc-thumb">'
        + (p.previewUrl ? '<img src="' + p.previewUrl + '" alt="receipt">' : '<span class="sc-thumb-pdf">📄 ' + scEsc(p.file.name || 'file') + '</span>')
        + '<button type="button" class="sc-thumb-rm" onclick="scRemovePhoto(' + i + ')">×</button></div>'
      ).join('') + '</div>';
    }
    html += scDiagHtml();
  }

  else if (S.step === 'system' || S.step === 'project' || S.step === 'type') {
    let list, sel;
    if (S.step === 'system') { list = SYSTEMS; sel = S.sys; }
    else if (S.step === 'project') { list = scProjectOptions(); sel = S.project; }
    else { list = TYPES[S.sys]; sel = S.type; }
    if (S.step === 'project' && !list.length) {
      html += '<p class="sc-sub">Loading projects…</p>';
    }
    html += '<div class="sc-options">' + list.map((o) => {
      const on = o.v === sel;
      return '<button type="button" class="sc-opt' + (on ? ' on' : '') + '" onclick="scChoose(\'' + S.step + '\',\'' + scEsc(o.v) + '\')">'
        + '<div><div class="sc-opt-label">' + scEsc(o.l) + '</div>'
        + (o.s ? '<div class="sc-opt-sub">' + scEsc(o.s) + '</div>' : '') + '</div>'
        + '<span class="sc-radio">' + (on ? '<span>✓</span>' : '') + '</span></button>';
    }).join('') + '</div>';
  }

  else if (S.step === 'category' || S.step === 'labor') {
    const field = S.step === 'category' ? 'cat' : 'labor';
    const ph = S.step === 'category' ? 'e.g. Tiling & masonry' : 'e.g. Juan Dela Cruz';
    html += '<input class="sc-text" id="scTextInput" value="' + scEsc(S[field]) + '" placeholder="' + ph + '" oninput="scSetField(\'' + field + '\', this.value)">';
    if (S.step === 'category') {
      html += '<div class="sc-chips">' + scCats().map((c) =>
        '<button type="button" class="sc-chip' + (S.cat === c ? ' on' : '') + '" onclick="scPickCat(\'' + scEsc(c).replace(/'/g, "\\'") + '\')">' + scEsc(c) + '</button>'
      ).join('') + '</div>';
    }
  }

  else if (S.step === 'note') {
    html += '<textarea class="sc-text" rows="5" placeholder="Optional — supplier, what it’s for…" oninput="scSetField(\'note\', this.value)">' + scEsc(S.note) + '</textarea>';
  }

  else if (S.step === 'review') {
    const sysL  = (SYSTEMS.find((x) => x.v === S.sys) || {}).l || '—';
    const typeL = (TYPES[S.sys].find((x) => x.v === S.type) || {}).l || '—';
    const projL = (scProjectOptions().find((x) => x.v === S.project) || {}).l || '—';
    const rows = [
      ['Photos', S.photos.length + ' file' + (S.photos.length === 1 ? '' : 's')],
      ['System', sysL], ['Project', projL], ['Type', typeL],
    ];
    if (S.type === 'materials') rows.push(['Material', S.cat || '—']);
    if (S.type === 'labor') rows.push(['Worker', S.labor || '—']);
    rows.push(['Note', S.note || '—']);
    html += '<div class="sc-review">' + rows.map(([l, v]) =>
      '<div class="sc-rrow"><span class="sc-rlabel">' + scEsc(l) + '</span><span class="sc-rvalue">' + scEsc(v) + '</span></div>'
    ).join('') + '</div>'
    + '<button type="button" class="sc-send" id="scSendBtn" onclick="scSend()">Send to Inbox</button>';
  }

  if (S.err) html += '<div class="sc-err">' + scEsc(S.err) + '</div>';
  $('scBody').innerHTML = html;

  // Footer: Back on any step past the first; Continue only on free-input steps
  // (choice steps auto-advance, review has its own Send button).
  const showContinue = ['photo', 'category', 'labor', 'note'].includes(S.step);
  const canBack = idx > 0;
  $('scFooter').classList.toggle('hidden', !(showContinue || canBack));
  $('scBack').classList.toggle('hidden', !canBack);
  $('scNext').classList.toggle('hidden', !showContinue);
  $('scNext').textContent = S.step === 'note' ? 'Review' : 'Continue';
}

// ── Boot: auth gate, then pickers + shared files ──
auth.onAuthStateChanged(async (user) => {
  if (!user) {
    $('scGate').classList.remove('hidden');
    $('scWizard').classList.add('hidden');
    return;
  }
  $('scGate').classList.add('hidden');
  $('scWizard').classList.remove('hidden');
  scRender();
  await Promise.all([scLoadPickers(), scLoadSharedFiles(), scCheckServiceWorker()]);
  scRender();
});
</script>
