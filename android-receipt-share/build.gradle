// Top-level build file. AGP 8.9.1 + Gradle 8.11.1 require JDK 17-21 — NOT 25.
// gradle.properties pins org.gradle.java.home to the Temurin 21 install so the
// build does not pick up the newer JDK that is also on this machine.
plugins {
    id 'com.android.application' version '8.9.1' apply false
    id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
}
